name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      RESIDENT_FIRST_NAME: ${{ secrets.RESIDENT_FIRST_NAME }}
      RESIDENT_ROOM: ${{ secrets.RESIDENT_ROOM }}
      RESIDENT_PIN: ${{ secrets.RESIDENT_PIN }}
      SELECTION_MODE: first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:resident-ordering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

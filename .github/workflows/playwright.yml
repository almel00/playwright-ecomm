name: Resident Ordering Tests

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment/site to test
        required: true
        type: environment
      test_suite:
        description: Test suite to run
        required: true
        default: resident-ordering
        type: choice
        options:
          - resident-ordering
          - coverage
          - all
      selection_mode:
        description: Selection mode for dynamic revenue center/menu/item choice
        required: true
        default: first
        type: choice
        options:
          - first
          - random
      run_search_test:
        description: Run item search coverage
        required: true
        default: false
        type: boolean
      run_multi_item_order:
        description: Run multi-item order coverage; places an extra order
        required: true
        default: false
        type: boolean
      run_payment_failure_test:
        description: Run checkout/payment edge-case inspection; does not submit
        required: true
        default: false
        type: boolean
  schedule:
    # Runs once daily at 6:00 PM Philippines time (10:00 UTC).
    - cron: '0 10 * * *'

jobs:
  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || vars.DEFAULT_TEST_ENVIRONMENT || 'default-site' }} / ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || vars.DEFAULT_TEST_SUITE || 'resident-ordering' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || vars.DEFAULT_TEST_ENVIRONMENT || 'default-site' }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      RESIDENT_FIRST_NAME: ${{ secrets.RESIDENT_FIRST_NAME }}
      RESIDENT_ROOM: ${{ secrets.RESIDENT_ROOM }}
      RESIDENT_PIN: ${{ secrets.RESIDENT_PIN }}
      INVALID_RESIDENT_FIRST_NAME: ${{ secrets.INVALID_RESIDENT_FIRST_NAME }}
      INVALID_RESIDENT_ROOM: ${{ secrets.INVALID_RESIDENT_ROOM }}
      INVALID_RESIDENT_PIN: ${{ secrets.INVALID_RESIDENT_PIN }}
      SELECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.selection_mode || vars.SELECTION_MODE || 'first' }}
      TARGET_REVENUE_CENTER: ${{ vars.TARGET_REVENUE_CENTER }}
      TARGET_MENU: ${{ vars.TARGET_MENU }}
      TARGET_ITEM: ${{ vars.TARGET_ITEM }}
      KITCHEN_MESSAGE: ${{ vars.KITCHEN_MESSAGE || 'Servingintel test. Please do not make!' }}
      RUN_SEARCH_TEST: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.run_search_test) || vars.RUN_SEARCH_TEST || 'false' }}
      SEARCH_ITEM_NAME: ${{ vars.SEARCH_ITEM_NAME }}
      RUN_MULTI_ITEM_ORDER: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.run_multi_item_order) || vars.RUN_MULTI_ITEM_ORDER || 'false' }}
      RUN_PAYMENT_FAILURE_TEST: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.run_payment_failure_test) || vars.RUN_PAYMENT_FAILURE_TEST || 'false' }}
      REPORT_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || vars.DEFAULT_TEST_SUITE || 'resident-ordering' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Select test command
        run: |
          case "$TEST_SUITE" in
            resident-ordering)
              echo "TEST_COMMAND=npm run test:resident-ordering" >> "$GITHUB_ENV"
              ;;
            coverage)
              echo "TEST_COMMAND=npm run test:coverage" >> "$GITHUB_ENV"
              ;;
            all)
              echo "TEST_COMMAND=npm run test:all" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported test suite: $TEST_SUITE"
              exit 1
              ;;
          esac

      - name: Run Playwright
        run: $TEST_COMMAND

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Resident Ordering Test Run"
            echo ""
            echo "- Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || vars.DEFAULT_TEST_ENVIRONMENT || 'default-site' }}"
            echo "- Suite: $TEST_SUITE"
            echo "- Site: ${SITE_NAME:-$BASE_URL}"
            echo "- Report root: test-results/reports"
            echo ""
            if [ -f test-results/order-summary.json ]; then
              echo "### Latest Order Summary"
              echo '```json'
              cat test-results/order-summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-ordering-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || vars.DEFAULT_TEST_ENVIRONMENT || 'default-site' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/reports
            test-results/order-summary.json
          if-no-files-found: warn

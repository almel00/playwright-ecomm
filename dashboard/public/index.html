<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resident Ordering Monitor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#runs">Skip to runs</a>
    <main class="shell">
      <header class="app-header" aria-label="Dashboard header">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Resident Ordering</p>
            <h1>QA Monitor</h1>
          </div>
        </div>
        <div class="header-actions">
          <a class="button button--secondary" id="actionsLink" href="https://github.com/almel00/playwright-ecomm/actions" target="_blank" rel="noreferrer">
            GitHub Actions
          </a>
          <button class="button" id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <section class="summary-grid" aria-label="Latest run summary">
        <article class="metric metric--primary">
          <span class="metric__label">Latest run</span>
          <strong id="latestStatus">Loading</strong>
          <span id="latestMeta">Connecting to GitHub Actions</span>
        </article>
        <article class="metric">
          <span class="metric__label">Pass rate</span>
          <strong id="passRate">--</strong>
          <span id="passRateMeta">Last 10 runs</span>
        </article>
        <article class="metric">
          <span class="metric__label">Latest check</span>
          <strong id="latestCheck">--</strong>
          <span id="latestPayment">--</span>
        </article>
        <article class="metric">
          <span class="metric__label">Order total</span>
          <strong id="latestTotal">--</strong>
          <span id="latestSite">--</span>
        </article>
      </section>

      <section class="toolbar" aria-label="Run filters">
        <div class="tabs" role="tablist" aria-label="Status filter">
          <button class="tab is-active" type="button" data-filter="all">All</button>
          <button class="tab" type="button" data-filter="success">Passed</button>
          <button class="tab" type="button" data-filter="failure">Failed</button>
          <button class="tab" type="button" data-filter="running">Running</button>
        </div>
        <label class="search">
          <span class="sr-only">Search runs</span>
          <input id="searchInput" type="search" placeholder="Search site, item, check">
        </label>
      </section>

      <section class="runs-panel" aria-label="Workflow runs">
        <div class="runs-head" aria-hidden="true">
          <span>Run</span>
          <span>Site</span>
          <span>Item</span>
          <span>Total</span>
          <span>Check</span>
          <span>Payment</span>
          <span>Duration</span>
          <span>Status</span>
        </div>
        <div id="runs" class="runs" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>

    <template id="runTemplate">
      <article class="run-card">
        <div class="run-card__summary" role="button" tabindex="0" data-action="toggle" aria-expanded="false">
          <div class="run-cell run-cell--run">
            <span class="run-number"></span>
            <span class="run-time"></span>
          </div>
          <div class="run-cell" data-field="site"></div>
          <div class="run-cell" data-field="item"></div>
          <div class="run-cell" data-field="total"></div>
          <div class="run-cell" data-field="check"></div>
          <div class="run-cell" data-field="payment"></div>
          <div class="run-cell" data-field="duration"></div>
          <div class="run-cell run-cell--status">
            <span class="badge"></span>
          </div>
        </div>

        <section class="run-details" hidden>
          <div class="detail-block">
            <h2>Checkout</h2>
            <dl class="detail-grid">
              <div><dt>Revenue center</dt><dd data-detail="revenueCenter"></dd></div>
              <div><dt>Menu</dt><dd data-detail="menu"></dd></div>
              <div><dt>Item price</dt><dd data-detail="itemPrice"></dd></div>
              <div><dt>Subtotal</dt><dd data-detail="subtotal"></dd></div>
              <div><dt>Tax</dt><dd data-detail="tax"></dd></div>
              <div><dt>Discount</dt><dd data-detail="discount"></dd></div>
              <div><dt>Total</dt><dd data-detail="detailTotal"></dd></div>
              <div><dt>Payment selected</dt><dd data-detail="checkoutPayment"></dd></div>
            </dl>
          </div>

          <div class="detail-block">
            <h2>Transaction</h2>
            <dl class="detail-grid">
              <div><dt>Check number</dt><dd data-detail="transactionCheck"></dd></div>
              <div><dt>Order ID</dt><dd data-detail="orderId"></dd></div>
              <div><dt>Transaction date</dt><dd data-detail="transactionDate"></dd></div>
              <div><dt>Payment type</dt><dd data-detail="transactionPayment"></dd></div>
              <div><dt>Total matched</dt><dd data-detail="totalMatched"></dd></div>
              <div><dt>Kitchen message</dt><dd data-detail="kitchenMessage"></dd></div>
              <div><dt>Payload captured</dt><dd data-detail="payloadMatched"></dd></div>
              <div><dt>Artifact</dt><dd data-detail="artifactName"></dd></div>
            </dl>
          </div>

          <div class="detail-block detail-block--wide">
            <h2>Result</h2>
            <p class="detail-note" data-detail="note"></p>
            <div class="detail-actions">
              <a data-link="run" target="_blank" rel="noreferrer">Open run</a>
              <a data-link="artifacts" target="_blank" rel="noreferrer">Open artifacts</a>
            </div>
          </div>
        </section>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
